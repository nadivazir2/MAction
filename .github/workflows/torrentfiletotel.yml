name: Torrent FIle To Telegram

on:
  workflow_dispatch:
    inputs:
      torrent_path:
        description: "Path to .torrent file in repo (example: torrents/file.torrent)"
        required: true
      
      package_name:
        description: "Name of the Package"
        required: true

      split_size:
        description: "Archive split size (example: 1900m)"
        required: true
        default: "40m"

jobs:
  torrent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install packages
        run: |

          sudo apt update

          sudo apt install -y \
            aria2 \
            p7zip-full \
            curl \
            jq

      - name: Prepare folders
        run: |

          mkdir -p downloads

      - name: Download selected files
        env:
          TORRENT_PATH: ${{ github.event.inputs.torrent_path }}
        run: |

          aria2c \
            --dir=downloads \
            --seed-time=0 \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --bt-save-metadata=true \
            --bt-tracker-connect-timeout=30 \
            --max-tries=10 \
            --retry-wait=5 \
            --continue=true \
            --summary-interval=5 \
            "$TORRENT_PATH"

      - name: Show downloaded files
        run: |

          echo "Downloaded Files:"
          ls -lah downloads

          echo ""
          echo "Disk Usage:"
          du -sh downloads

      - name: Compress and split
        run: |
          mkdir output

          7z a \
            -v${{ github.event.inputs.split_size }} \
            output/${{ github.event.inputs.package_name }}.$(date +%Y%m%d_%H%M%S).7z \
            ./downloads/*

      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        shell: bash
        run: |

          for file in output/*
          do

            echo ""
            echo "================================="
            echo "Uploading: $file"
            echo "================================="

            SUCCESS=0

            while [ $SUCCESS -eq 0 ]
            do

              RESPONSE=$(curl -s \
                -F document=@"$file" \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHAT_ID}")

              echo "$RESPONSE"

              OK=$(echo "$RESPONSE" | jq -r '.ok')

              if [ "$OK" = "true" ]; then

                echo ""
                echo "Upload successful."

                SUCCESS=1

              else

                ERROR_DESC=$(echo "$RESPONSE" | jq -r '.description')

                RETRY_AFTER=$(echo "$RESPONSE" | jq -r '.parameters.retry_after // 10')

                echo ""
                echo "Upload failed:"
                echo "$ERROR_DESC"

                echo ""
                echo "Retrying after ${RETRY_AFTER}s..."

                sleep "$RETRY_AFTER"

              fi

            done

          done

      - name: Cleanup
        if: always()
        run: |

          echo "Cleaning temporary files..."

          rm -rf downloads
          rm -rf output

          rm -f files.txt
          rm -f selected_indexes.txt

          sudo apt clean

          echo ""
          echo "Remaining Disk Space:"

          df -h