name: "Spotify & SoundCloud Downloader"

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: "Spotify or SoundCloud URL"
        required: true
        type: string

      output_format:
        description: "Output Format"
        required: true
        type: choice
        options:
          - mp3
          - flac
        default: mp3

      audio_quality:
        description: "Audio Quality"
        required: true
        type: choice
        options:
          - 128k
          - 192k
          - 320k
        default: 320k

      max_part_mb:
        description: "Max Part Size (MB)"
        required: false
        type: string
        default: "40"

permissions:
  contents: write

jobs:
  media-download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y \
            ffmpeg \
            curl \
            jq \
            zip \
            p7zip-full \
            python3 \
            python3-pip

          pip3 install --quiet yt-dlp

      - name: Create Download Folder
        shell: bash
        run: |
          mkdir -p release_files

      - name: Start Downtify Container
        if: contains(github.event.inputs.media_url, 'spotify.com')
        shell: bash
        run: |
          docker run -d \
            --name downtify \
            -p 8000:8000 \
            ghcr.io/henriquesebastiao/downtify:latest

          echo "Waiting for Downtify startup..."
          sleep 40

      - name: Debug Downtify Routes
        if: contains(github.event.inputs.media_url, 'spotify.com')
        shell: bash
        run: |
          echo "Checking available routes..."

          curl -s http://localhost:8000/openapi.json || true

      - name: Download Spotify Media
        if: contains(github.event.inputs.media_url, 'spotify.com')
        shell: bash
        run: |
          URL="${{ github.event.inputs.media_url }}"

          echo "Spotify detected"

          curl -L \
            "http://localhost:8000/download?url=$URL" \
            --output "release_files/spotify_download.mp3"

      - name: Download SoundCloud Media
        if: contains(github.event.inputs.media_url, 'soundcloud.com')
        shell: bash
        run: |
          URL="${{ github.event.inputs.media_url }}"
          FORMAT="${{ github.event.inputs.output_format }}"
          QUALITY="${{ github.event.inputs.audio_quality }}"

          echo "SoundCloud detected"

          yt-dlp \
            -x \
            --audio-format "$FORMAT" \
            --audio-quality "$QUALITY" \
            -o "release_files/%(title)s.%(ext)s" \
            "$URL"

      - name: Validate Download
        shell: bash
        run: |
          FILE_COUNT=$(find release_files -type f | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No files downloaded"
            exit 1
          fi

          echo "Downloaded files:"
          ls -lh release_files/

      - name: Split Large Files
        shell: bash
        run: |
          mkdir output

          7z a \
            -v${{ github.event.inputs.max_part_mb }} \
            output/spotify.$(date +%Y%m%d_%H%M%S).7z \
            ./release_files/*

      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        shell: bash
        run: |

          for file in output/*
          do

            echo ""
            echo "================================="
            echo "Uploading: $file"
            echo "================================="

            SUCCESS=0

            while [ $SUCCESS -eq 0 ]
            do

              RESPONSE=$(curl -s \
                -F document=@"$file" \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHAT_ID}")

              echo "$RESPONSE"

              OK=$(echo "$RESPONSE" | jq -r '.ok')

              if [ "$OK" = "true" ]; then

                echo ""
                echo "Upload successful."

                SUCCESS=1

              else

                ERROR_DESC=$(echo "$RESPONSE" | jq -r '.description')

                RETRY_AFTER=$(echo "$RESPONSE" | jq -r '.parameters.retry_after // 10')

                echo ""
                echo "Upload failed:"
                echo "$ERROR_DESC"

                echo ""
                echo "Retrying after ${RETRY_AFTER}s..."

                sleep "$RETRY_AFTER"

              fi

            done

          done


      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f downtify 2>/dev/null || true
          rm -rf release_files
