
name: VoiceStudio Models Downloader

on:
  workflow_dispatch:
    inputs:
      hf_endpoint:
        description: "Hugging Face endpoint"
        required: true
        default: "https://huggingface.co"
        type: string
      part_mib:
        description: "Telegram part size in MiB"
        required: true
        default: "45"
        type: string

permissions:
  contents: read

jobs:
  download-package-send:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - key: parakeet-tdt-v3
            repo: csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
            revision: 2bda32ec70b097a55adaa07d9a7173915b43cc78

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_ENDPOINT: ${{ inputs.hf_endpoint }}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"
      OMNIVOICE_DOWNLOAD_MAX_WORKERS: "8"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODEL_ID: ${{ matrix.repo }}
      MODEL_REVISION: ${{ matrix.revision }}
      MODEL_KEY: ${{ matrix.key }}
      PART_MIB: ${{ inputs.part_mib }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub==0.36.0 requests

      - name: Download, package, split and upload
        run: python .github/scripts/download_and_send_model.py
