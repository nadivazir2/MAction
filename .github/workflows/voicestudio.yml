
name: Parakeet TDT v3 To Telegram

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    env:
      MODEL_ID: deepdml/faster-whisper-large-v3-turbo-ct2
      MODEL_REVISION: 4df90f75321148c3a29a9e2351b7ddf8f5b115a8

      PACKAGE_NAME: whisper-turbo
      PART_SIZE: 47185920

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"

      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
            python3 \
            python3-venv \
            python3-pip \
            jq \
            curl

          python3 -m venv .venv

          .venv/bin/pip install \
            huggingface_hub==0.36.0

      - name: Validate settings
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing."
            exit 1
          fi

          if [ -z "$HF_TOKEN" ]; then
            echo "WARNING: HF_TOKEN is empty."
            echo "Continuing with anonymous Hugging Face access."
          fi

          echo "Settings validated."

      - name: Prepare folders
        run: |
          set -euo pipefail

          mkdir -p work
          mkdir -p output

          echo "Model:"
          echo "$MODEL_ID"

          echo ""
          echo "Revision:"
          echo "$MODEL_REVISION"

          echo ""
          echo "Package:"
          echo "$PACKAGE_NAME"

          echo ""
          echo "Part size: 45 MiB"

      - name: Download model from Hugging Face
        run: |
          set -euo pipefail

          .venv/bin/python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          model_id = os.environ["MODEL_ID"]
          revision = os.environ["MODEL_REVISION"]

          print("Starting download...")
          print("Repository:", model_id)
          print("Revision:", revision)

          snapshot_path = snapshot_download(
              repo_id=model_id,
              revision=revision,
              cache_dir="work/hf_cache",
              token=os.environ.get("HF_TOKEN") or None,
              max_workers=8
          )

          print("")
          print("Download completed.")
          print("Snapshot:", snapshot_path)

          with open("work/snapshot_path.txt", "w") as f:
              f.write(snapshot_path)
          PY

      - name: Prepare model cache
        run: |
          set -euo pipefail

          .venv/bin/python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          model_id = os.environ["MODEL_ID"]
          revision = os.environ["MODEL_REVISION"]

          snapshot = Path(
              Path("work/snapshot_path.txt").read_text().strip()
          )

          if not snapshot.is_dir():
              raise RuntimeError("Snapshot directory not found.")

          if snapshot.name != revision:
              raise RuntimeError(
                  f"Revision mismatch: {snapshot.name}"
              )

          required_files = [
              "encoder.int8.onnx",
              "decoder.int8.onnx",
              "joiner.int8.onnx",
              "tokens.txt"
          ]

          print("Checking required files...")

          for filename in required_files:
              file_path = snapshot / filename

              if not file_path.is_file():
                  raise FileNotFoundError(
                      f"Missing required file: {filename}"
                  )

              print(
                  f"OK: {filename} "
                  f"({file_path.stat().st_size:,} bytes)"
              )

          repo_name = "models--" + model_id.replace("/", "--")

          repo_cache = Path("work/export") / repo_name

          snapshot_target = (
              repo_cache / "snapshots" / revision
          )

          snapshot_target.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          print("")
          print("Copying snapshot...")

          shutil.copytree(
              snapshot,
              snapshot_target,
              symlinks=False,
              dirs_exist_ok=True
          )

          refs = repo_cache / "refs"
          refs.mkdir(parents=True, exist_ok=True)

          (refs / "main").write_text(revision)

          (repo_cache / "voicestudio-revision").write_text(
              revision
          )

          file_count = sum(
              1 for item in snapshot_target.rglob("*")
              if item.is_file()
          )

          print("")
          print("Cache preparation completed.")
          print("Repository cache:", repo_cache)
          print("Snapshot files:", file_count)
          PY

      - name: Show downloaded files
        run: |
          set -euo pipefail

          echo "Model files:"

          find work/export -type f -printf '%p\n'

          echo ""
          echo "Disk usage:"

          du -sh work

          echo ""
          echo "Available disk space:"

          df -h .

      - name: Create archive and split
        run: |
          set -euo pipefail

          .venv/bin/python - <<'PY'
          import os
          import re
          import tarfile
          import hashlib
          import json
          from pathlib import Path

          package = os.environ["PACKAGE_NAME"]
          revision = os.environ["MODEL_REVISION"]
          model_id = os.environ["MODEL_ID"]

          part_size = int(os.environ["PART_SIZE"])

          export_dir = Path("work/export")
          output_dir = Path("output")

          archive = output_dir / (
              f"{package}_{revision}.tar"
          )

          def sha256_file(path):
              digest = hashlib.sha256()

              with open(path, "rb") as file:
                  for chunk in iter(
                      lambda: file.read(1024 * 1024), b""
                  ):
                      digest.update(chunk)

              return digest.hexdigest()

          print("Creating TAR archive...")

          with tarfile.open(archive, "w") as tar:
              for item in export_dir.iterdir():
                  tar.add(item, arcname=item.name)

          archive_size = archive.stat().st_size
          archive_hash = sha256_file(archive)

          print("Archive:", archive.name)
          print("Archive size:", archive_size)
          print("Archive SHA256:", archive_hash)

          print("")
          print("Splitting archive...")

          parts = []

          with open(archive, "rb") as source:
              index = 1

              while True:
                  data = source.read(part_size)

                  if not data:
                      break

                  part_name = (
                      f"{package}.part-{index:03d}"
                  )

                  part_path = output_dir / part_name

                  with open(part_path, "wb") as target:
                      target.write(data)

                  part_hash = hashlib.sha256(data).hexdigest()

                  parts.append({
                      "filename": part_name,
                      "size": len(data),
                      "sha256": part_hash
                  })

                  print(
                      f"{part_name}: {len(data):,} bytes"
                  )

                  index += 1

          if not parts:
              raise RuntimeError("No archive parts created.")

          manifest = {
              "model_id": model_id,
              "revision": revision,
              "archive": archive.name,
              "archive_size": archive_size,
              "archive_sha256": archive_hash,
              "part_size": part_size,
              "part_count": len(parts),
              "parts": parts
          }

          manifest_path = output_dir / (
              f"{package}_manifest.json"
          )

          with open(manifest_path, "w") as file:
              json.dump(manifest, file, indent=2)

          print("")
          print("Archive created successfully.")
          print("Total parts:", len(parts))
          print("Manifest:", manifest_path)
          PY

      - name: Show output files
        run: |
          set -euo pipefail

          echo "Output files:"

          ls -lh output

          echo ""
          echo "Total output size:"

          du -sh output

      - name: Upload parts to Telegram
        shell: bash
        run: |
          set -euo pipefail

          for file in output/*.part-*
          do
            echo ""
            echo "================================="
            echo "Uploading: $file"
            echo "================================="

            SUCCESS=0
            ATTEMPT=0
            MAX_ATTEMPTS=5

            while [ "$SUCCESS" -eq 0 ] && \
                  [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]
            do
              ATTEMPT=$((ATTEMPT + 1))

              echo "Attempt: $ATTEMPT / $MAX_ATTEMPTS"

              if RESPONSE=$(curl -sS \
                --connect-timeout 30 \
                --max-time 900 \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${file}" \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")
              then
                OK=$(jq -r '.ok // false' <<< "$RESPONSE")

                echo "$RESPONSE"
              else
                OK="false"
                RESPONSE=""
              fi

              if [ "$OK" = "true" ]; then
                echo "Upload successful."
                SUCCESS=1

              else
                ERROR_DESC=$(
                  jq -r '.description // "Network or API error"' \
                    <<< "$RESPONSE" 2>/dev/null || \
                    echo "Network or API error"
                )

                RETRY_AFTER=$(
                  jq -r '.parameters.retry_after // 10' \
                    <<< "$RESPONSE" 2>/dev/null || \
                    echo "10"
                )

                if ! [[ "$RETRY_AFTER" =~ ^[0-9]+$ ]]; then
                  RETRY_AFTER=10
                fi

                echo ""
                echo "Upload failed:"
                echo "$ERROR_DESC"

                if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                  echo "Retrying after ${RETRY_AFTER}s..."
                  sleep "$RETRY_AFTER"
                fi
              fi
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERROR: Upload failed after 5 attempts."
              exit 1
            fi
          done

          echo ""
          echo "All parts uploaded successfully."

      - name: Upload manifest to Telegram
        shell: bash
        run: |
          set -euo pipefail

          FILE="output/${PACKAGE_NAME}_manifest.json"

          if [ ! -f "$FILE" ]; then
            echo "Manifest not found."
            exit 1
          fi

          echo "Uploading manifest..."

          SUCCESS=0
          ATTEMPT=0
          MAX_ATTEMPTS=5

          while [ "$SUCCESS" -eq 0 ] && \
                [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]
          do
            ATTEMPT=$((ATTEMPT + 1))

            echo "Attempt: $ATTEMPT / $MAX_ATTEMPTS"

            if RESPONSE=$(curl -sS \
              --connect-timeout 30 \
              --max-time 120 \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${FILE}" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")
            then
              OK=$(jq -r '.ok // false' <<< "$RESPONSE")
              echo "$RESPONSE"
            else
              OK="false"
              RESPONSE=""
            fi

            if [ "$OK" = "true" ]; then
              SUCCESS=1
              echo "Manifest uploaded successfully."

            else
              ERROR_DESC=$(
                jq -r '.description // "Network or API error"' \
                  <<< "$RESPONSE" 2>/dev/null || \
                  echo "Network or API error"
              )

              RETRY_AFTER=$(
                jq -r '.parameters.retry_after // 10' \
                  <<< "$RESPONSE" 2>/dev/null || \
                  echo "10"
              )

              if ! [[ "$RETRY_AFTER" =~ ^[0-9]+$ ]]; then
                RETRY_AFTER=10
              fi

              echo "Upload failed: $ERROR_DESC"

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                sleep "$RETRY_AFTER"
              fi
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: Manifest upload failed."
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning temporary files..."

          rm -rf work
          rm -rf output
          rm -rf .venv

          echo ""
          echo "Remaining disk space:"

          df -h .
